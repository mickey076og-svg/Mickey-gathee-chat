<script>
// Anti-screenshot
const lockScreen=document.getElementById('mickey-lock');
function showLock(){lockScreen.style.display='flex'; document.getElementById('container').style.filter='blur(35px)'}
function hideLock(){lockScreen.style.display='none'; document.getElementById('container').style.filter='none'}
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('visibilitychange',()=>{if(document.hidden)showLock()}); window.addEventListener('blur',showLock); window.addEventListener('focus',hideLock);
document.addEventListener('keydown',e=>{if(e.key==='PrintScreen'){e.preventDefault(); showLock(); setTimeout(hideLock,2000)}});

const socket=io(); let currentRoom="",currentUser="",isHost=false;
function joinAsUser(){const u=document.getElementById('username').value.trim(); const r=document.getElementById('roomCode').value.trim(); if(!u||!r)return alert('Enter details'); currentUser=u; currentRoom=r; isHost=false; startChat();}
function joinAsHost(){const r=document.getElementById('roomCode').value.trim(); if(!r)return alert('Enter code'); const p=prompt('Host PIN:'); if(p!=='mickey123')return alert('Wrong'); currentUser='Mickey Gathee [HOST]'; currentRoom=r; isHost=true; startChat();}
function startChat(){document.getElementById('login').style.display='none'; document.getElementById('chatArea').style.display='flex'; if(isHost)document.getElementById('hostPanel').style.display='block'; socket.emit('joinRoom',{username:currentUser, roomCode:currentRoom, isHost});}
function sendMessage(){const t=document.getElementById('messageInput').value.trim(); if(!t)return; socket.emit('privateMessage',{roomCode:currentRoom, user:currentUser, text:t}); document.getElementById('messageInput').value="";}
