<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Mickey Gathee Chat | All Rooms + Anti Shot</title>
<style>
*{ -webkit-user-select:none !important; -moz-user-select:none !important; user-select:none !important; -webkit-touch-callout:none !important; -webkit-tap-highlight-color: transparent !important; }
body{margin:0; font-family:'Segoe UI',sans-serif; background:#0a0a0a; color:#fff; display:flex; justify-content:center}
#container{width:100%; max-width:480px; height:100vh; display:flex; flex-direction:column; background:#121212}
#header{background:#1f1f1f; padding:15px; text-align:center; border-bottom:2px solid #25D366}
#header h2{margin:0; color:#25D366}
#login{padding:25px 20px} input{width:100%; padding:14px; margin:8px 0; border-radius:10px; border:1px solid #333; background:#1e1e1e; color:#fff}
button{width:100%; padding:14px; border:none; border-radius:10px; background:#25D366; color:#000; font-weight:bold; cursor:pointer; margin-top:8px}
button.hostBtn{background:#fff; border:2px solid #25D366}
#chatArea{display:none; flex-direction:column; height:100%}
#messages{flex:1; overflow-y:auto; padding:15px; background:#000; display:flex; flex-direction:column}
.msg{margin:8px 0; padding:10px 12px; border-radius:12px; max-width:85%; word-wrap:break-word; position:relative; overflow:hidden}
.msg::after{content:attr(data-watermark); position:absolute; top:50%; left:50%; transform:translate(-50%,-50%) rotate(-25deg); font-size:9px; color:rgba(255,255,255,0.07); pointer-events:none; white-space:nowrap; z-index:1}
.myMsg{background:#25D366; color:#000; margin-left:auto} .otherMsg{background:#2a2a2a; margin-right:auto}
.hostMsg{background:linear-gradient(90deg,#25D366,#128C7E); color:#fff; border:1px solid gold; margin-right:auto}
.viewOnceBox{border:2px dashed #25D366; padding:12px; border-radius:10px; text-align:center; cursor:pointer; background:rgba(37,211,102,0.1)}
.viewOnceBox.opened{border-style:solid; background:#1a1a1a; cursor:default}
img, video{pointer-events:none; -webkit-user-drag:none}
#inputArea{display:flex; gap:6px; padding:10px; background:#1f1f1f; align-items:center}
#inputArea input{flex:1} #hostPanel{display:none; padding:10px; background:#1a1a1a}
#usersList{font-size:12px; padding:8px 15px; background:#181818; display:flex; justify-content:space-between; align-items:center}
#mickey-lock{display:none; position:fixed; inset:0; z-index:999999; background:#000; color:#25D366; font-size:28px; align-items:center; justify-content:center; flex-direction:column; text-align:center; font-weight:bold}
#screen-block{display:none; position:fixed; inset:0; z-index:999998; background:#000}
</style>
</head>
<body>
<div id="mickey-lock"><div>🔒 SECURED BY MICKEY</div><div style="font-size:14px; color:#fff; margin-top:10px;">No Screenshot Allowed 🏑<br/>Your screen = Black</div></div>
<div id="screen-block"></div>
<div id="container">
<div id="header"><h2>🔒 MICKEY GATHEE CHAT</h2><p id="roomInfo">Any Room Code Works • Private</p></div>
<div id="login">
  <input id="username" placeholder="Your Name">
  <input id="roomCode" placeholder="Enter ANY Room Code e.g. mickey123">
  <button onclick="joinAsUser()">Join Private Chat</button>
  <button class="hostBtn" onclick="joinAsHost()">👑 Host Login</button>
  <p style="font-size:11px; text-align:center; opacity:0.5; margin-top:10px;">Any code = private room. Share same code = chat together.</p>
</div>
<div id="chatArea"><div id="usersList"></div><div id="messages"></div><div id="hostPanel"><button onclick="clearChat()" style="background:#ff3b30; color:#fff;">Clear All</button></div>
<div id="inputArea">
<input type="file" id="mediaFile" accept="image/*,video/*" style="display:none">
<button onclick="document.getElementById('mediaFile').click()" style="width:45px; background:#333; color:#fff;">📎</button>
<label style="display:flex; align-items:center; gap:4px; font-size:12px;"><input type="checkbox" id="viewOnceCheck" style="width:15px;"> 👁️</label>
<input id="messageInput" placeholder="Message..."><button onclick="sendMessage()" style="width:65px;">Send</button>
</div></div></div>

<script src="/socket.io/socket.io.js"></script>
<script>
// ===== MICKEY ANTI-SCREENSHOT ULTIMATE =====
const lockScreen=document.getElementById('mickey-lock');
const screenBlock=document.getElementById('screen-block');
function showLock(){lockScreen.style.display='flex'; screenBlock.style.display='block'; document.getElementById('container').style.filter='blur(60px) brightness(0)'; document.getElementById('container').style.pointerEvents='none';}
function hideLock(){lockScreen.style.display='none'; screenBlock.style.display='none'; document.getElementById('container').style.filter='none'; document.getElementById('container').style.pointerEvents='auto';}
document.addEventListener('contextmenu',e=>{e.preventDefault(); showLock(); setTimeout(hideLock,1500); return false;});
document.addEventListener('selectstart',e=>e.preventDefault());
document.addEventListener('copy',e=>{e.preventDefault(); showLock();});
document.addEventListener('keydown',e=>{
  if(e.key==='PrintScreen' || (e.ctrlKey && e.key==='p') || (e.metaKey && e.shiftKey && (e.key==='4' || e.key==='3')) || e.key==='F12'){
    e.preventDefault(); e.stopPropagation(); showLock(); navigator.clipboard.writeText('SECURED BY MICKEY').catch(()=>{}); setTimeout(hideLock,3000); return false;
  }
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)showLock(); else setTimeout(hideLock,800);});
window.addEventListener('blur',showLock); window.addEventListener('focus',()=>setTimeout(hideLock,800));
if(navigator.mediaDevices){ navigator.mediaDevices.getDisplayMedia = async()=>{ showLock(); alert('🔒 Screen Recording Blocked by Mickey'); throw new Error('Blocked'); } }
function getWatermarkText(){ return `${currentUser} • ${new Date().toLocaleTimeString()} • MICKEY SECURED`; }
// ===== END SHIELD =====

const socket=io(); let currentRoom="",currentUser="",isHost=false;

window.addEventListener('DOMContentLoaded',()=>{
  const params=new URLSearchParams(window.location.search);
  const roomFromLink=params.get('room');
  if(roomFromLink){ document.getElementById('roomCode').value=roomFromLink; document.getElementById('roomInfo').innerHTML=`Link: <b style="color:#25D366">${roomFromLink}</b> - Enter name`; }
});

function joinAsUser(){
  const u=document.getElementById('username').value.trim();
  const r=document.getElementById('roomCode').value.trim();
  if(!u) return alert('Enter Your Name'); if(!r) return alert('Enter Room Code - any works!');
  currentUser=u; currentRoom=r.toLowerCase(); isHost=false; startChat();
}
function joinAsHost(){
  const r=document.getElementById('roomCode').value.trim();
  if(!r) return alert('Enter Room Code');
  const p=prompt('Host PIN:'); if(p!=='mickey123') return alert('Wrong PIN');
  currentUser='Mickey Gathee [HOST]'; currentRoom=r.toLowerCase(); isHost=true; startChat();
}
function startChat(){
  document.getElementById('login').style.display='none'; document.getElementById('chatArea').style.display='flex';
  if(isHost)document.getElementById('hostPanel').style.display='block';
  document.getElementById('roomInfo').innerHTML=`Room: <b style="background:#25D366; color:#000; padding:3px 8px; border-radius:5px;">${currentRoom}</b>`;
  window.history.replaceState({}, '', `?room=${currentRoom}`);
  socket.emit('joinRoom',{username:currentUser, roomCode:currentRoom, isHost});
}
function sendMessage(){const t=document.getElementById('messageInput').value.trim(); if(!t)return; socket.emit('privateMessage',{roomCode:currentRoom, user:currentUser, text:t}); document.getElementById('messageInput').value="";}
function copyRoom(){ const link=`${window.location.origin}${window.location.pathname}?room=${currentRoom}`; navigator.clipboard.writeText(link); alert('Link Copied:\n'+link); }

const mediaInput=document.getElementById('mediaFile');
mediaInput.addEventListener('change',()=>{
  const file=mediaInput.files[0]; if(!file)return; if(file.size>10*1024*1024)return alert('Max 10MB');
  const isViewOnce=document.getElementById('viewOnceCheck').checked;
  const reader=new FileReader();
  reader.onload=()=>{ socket.emit('privateMessage',{roomCode:currentRoom, user:currentUser, text:isViewOnce?'👁️ View-Once':'', media:reader.result, mediaType:file.type, fileName:file.name, viewOnce:isViewOnce}); };
  reader.readAsDataURL(file); mediaInput.value=''; document.getElementById('viewOnceCheck').checked=false;
});

socket.on('privateMessage',(data)=>{
  const div=document.createElement('div'); const isMe=data.user===currentUser;
  div.className=`msg ${isMe?'myMsg':data.isHost?'hostMsg':'otherMsg'}`;
  div.setAttribute('data-watermark', `${data.user} • ${data.time} • SECURED`);
  let mediaHTML='';
  if(data.media){
    if(data.viewOnce){
      const id='vo_'+Date.now()+'_'+Math.random().toString(36).slice(2);
      if(isMe){ mediaHTML=`<div class="viewOnceBox opened"><small>👁️ You sent view-once</small><br><img src="${data.media}" style="max-width:100%; border-radius:10px; margin-top:6px"></div>`; }
      else{ mediaHTML=`<div class="viewOnceBox" id="${id}" onclick="openViewOnce('${id}', \`${data.media}\`)"><b>👁️ View-Once Photo</b><br><small>Tap to view - disappears</small></div>`; }
    }else{
      if(data.mediaType.startsWith('image/')) mediaHTML=`<img src="${data.media}" style="max-width:100%; border-radius:10px; margin-top:6px">`;
      else mediaHTML=`<video src="${data.media}" controls style="max-width:100%; border-radius:10px; margin-top:6px"></video>`;
    }
  }
  div.innerHTML=`<b>${data.user}</b><br>${data.text}<br>${mediaHTML}
